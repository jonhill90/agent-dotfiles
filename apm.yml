name: agent-dotfiles
version: 0.1.0
description: >-
  Jon Hill's agent dotfiles — versioned personal harness for AI coding
  agents. Portable skills, canonical instructions, hooks, agents, and
  MCP declarations, deployed at user scope via apm install -g plus a
  thin sync wrapper (see docs/SPEC.md).
dependencies:
  apm:
    # Candidate public skills collection (jonhill90/skills#127, not yet
    # merged). Pinned to that PR branch's head commit rather than the
    # branch name: a branch ref moves, and #9 requires a reproducible,
    # independently-verifiable pin. Bump this SHA (and re-verify) once
    # #127 merges to main, then again on every subsequent skill change.
    - git: https://github.com/jonhill90/skills.git
      ref: 069e2c475e875be1c23a31e7f5da08ffd58d655a
      skills: ["*"]
      alias: skills-public
    # Private companion collection (#9). Pinned the same way. Currently
    # carries one harmless, non-rostered fixture (source-probe) proving
    # authenticated resolution; see skills-private's own PR.
    - git: https://github.com/jonhill90/skills-private.git
      ref: b203b1ebf2c2eb35808443ba76cd22aadecf76e7
      skills: ["*"]
      alias: skills-private
  mcp: []
